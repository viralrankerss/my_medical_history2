name: my_medical_history
description: Offline medical history mini app with SQLite and manual backup
publish_to: none
version: 2.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  file_picker: ^10.3.3
  share_plus: ^12.0.1
  url_launcher: ^6.3.2

flutter:
  uses-material-design: true
